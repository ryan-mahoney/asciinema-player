[package]
name = "vt-js"
version = "0.1.0"
authors = ["Marcin Kulik <m@ku1ik.com>"]
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
avt = { git = "https://github.com/ryan-mahoney/avt", rev = "ec8b8264ba03fdd6ef9c84a61117d4fa78a9bbcf" }
serde = { version = "1.0.130", features = ["derive"], default-features = false }
serde-wasm-bindgen = "0.6.5"
talc = "5.0.3"

[dependencies.wasm-bindgen]
version = "0.2.106"
features = ["serde-serialize"]


[dev-dependencies]
wasm-bindgen-test = "^0.3"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "z"
strip = true
